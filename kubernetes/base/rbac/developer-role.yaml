# =============================================================
# Developer RBAC Role
# Author: Kiran S | AU Technology Consulting
# Least privilege access for application developers
# =============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer
  namespace: production
rules:
  # Read-only access to deployments
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]

  # View pods and logs (no exec in production)
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]

  # Read configmaps (not secrets)
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]

  # View HPA
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-binding
  namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developer
subjects:
  - kind: Group
    name: developers
    apiGroup: rbac.authorization.k8s.io
