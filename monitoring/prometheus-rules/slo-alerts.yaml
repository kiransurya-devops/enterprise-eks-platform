# =============================================================
# SLO-Based Alert Rules
# Author: Kiran S | AU Technology Consulting
# Achievement: MTTR reduced 35% (52 min to 34 min)
# Uses multiwindow multi-burn-rate alerting
# =============================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-burn-rate-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: slo_recording_rules
      interval: 30s
      rules:
        - record: job:http_error_rate:ratio5m
          expr: |
            sum(rate(http_requests_total{code=~"5.."}[5m]))
            / sum(rate(http_requests_total[5m]))

        - record: job:http_error_rate:ratio1h
          expr: |
            sum(rate(http_requests_total{code=~"5.."}[1h]))
            / sum(rate(http_requests_total[1h]))

        - record: job:http_error_rate:ratio6h
          expr: |
            sum(rate(http_requests_total{code=~"5.."}[6h]))
            / sum(rate(http_requests_total[6h]))

    - name: slo_burn_rate_alerts
      rules:
        # CRITICAL: Fast burn — page immediately
        - alert: SLOBurnRateCritical
          expr: |
            job:http_error_rate:ratio1h > (14.4 * 0.001)
            and
            job:http_error_rate:ratio5m > (14.4 * 0.001)
          for: 2m
          labels:
            severity: critical
            slo: "99.9"
          annotations:
            summary: "SLO burn rate critical — page on call now"
            description: "Error budget burning 14.4x faster than baseline."
            runbook_url: "https://github.com/kiransurya-devops/enterprise-eks-platform/blob/main/docs/runbooks/slo-burn.md"

        # HIGH: Slower burn
        - alert: SLOBurnRateHigh
          expr: |
            job:http_error_rate:ratio6h > (6 * 0.001)
            and
            job:http_error_rate:ratio1h > (6 * 0.001)
          for: 15m
          labels:
            severity: high
            slo: "99.9"
          annotations:
            summary: "SLO burn rate elevated — investigate within 30 min"
